<!DOCTYPE html>
<html>

<body>

    <h2>Methods and Loops</h2>
    <p>Numbers from 1 to 10</p>
    <p id="numbers"></p>
    <p id="random"></p>
    <p id="day"></p>

    <script>
    // PART 1: the numbers 1 to 10
    // YOUR CODE HERE
    // Make a variable text that starts as an empty string "".
    var text="";
    // Use a for loop from 1 to 10. Each time, add the number and "<br>" to text.
    var i;
    for (i = 1; i <= 10; i++) {
            text += i + "<br>";
        }
    // After the loop, put text inside the paragraph with id "numbers".
    document.getElementById("numbers").innerHTML = text;

    // PART 2: a random whole number
    // YOUR CODE HERE
    // Make a random number from 0 to 99 with Math.random() and Math.floor().
    var randnum=Math.floor(Math.random()*99);

    // Show "The random number is " and the number in the paragraph with id "random".
    document.getElementById("random").innerHTML = "The random number is " + randnum;

    // PART 3: today's day number
    // YOUR CODE HERE
    // Get the day number with new Date().getDay().
    // Show "Today's day number is " and the number in the paragraph with id "day".
        var day;
        day= new Date().getDay();
        document.getElementById("day").innerHTML = "Today's day number is "+day;
    </script>
</body>
</html>
